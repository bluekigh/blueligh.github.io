<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>게임 디자인 문서 모음</title><style>body{font:17px/1.75 system-ui,sans-serif;max-width:850px;margin:auto;padding:32px 20px;background:#f8fafc;color:#182331}a{color:#145bb3}article{background:white;border:1px solid #dce3ed;border-radius:14px;padding:24px;margin:20px 0}small{color:#566377}</style></head><body><h1>게임 디자인 문서 모음</h1><p>이 폴더의 하위 문서를 탐색할 수 있는 색인입니다. 게임 개발 프로젝트와 별도로 관리합니다.</p><article><h2><a href="./game-design-concepts-ko/">게임 디자인의 개념 — 한국어 번역</a></h2><p>Ian Schreiber의 <em>Game Design Concepts</em>(2009) 강의 번역 프로젝트. 원문·저작권·제3자 자료를 추적하며 순차적으로 번역합니다.</p><small>번역 진행 상태와 강의 목차는 하위 페이지에서 확인할 수 있습니다.</small></article></body></html>
